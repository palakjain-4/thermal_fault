spring.application.name=thermal-fault-detection
server.port=8000

# File Upload Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# File Storage Configuration
thermal.storage.raw-dir=uploads/raw
thermal.storage.processed-dir=uploads/processed
thermal.storage.reports-dir=reports

# Model Configuration
thermal.model.path=models/thermal_resnet18.onnx
thermal.model.name=ResNet18-Thermal-CNN
thermal.model.version=v1.0-ONNX
thermal.model.input-width=224
thermal.model.input-height=224
thermal.model.confidence-threshold=0.55
thermal.model.enabled=true

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/thermal_fault_detection
spring.data.mongodb.auto-index-creation=true

# Logging
logging.level.com.thermalfaultdetection=INFO
logging.level.org.springframework.data.mongodb=WARN
